name: Build Minimal FFmpeg (Loudness Scanner Only)

# Produces the smallest possible ffmpeg.exe/ffprobe.exe pair for ONE job:
# Auto-Audio.lua's background ebur128 loudness/true-peak scan (run_analysis)
# and its channel-layout probing (detect_downmix / prefetch_file). This is
# NOT a general-purpose ffmpeg -- it has no encoders, no video decoders, no
# hardware acceleration, and no output muxers besides "null". Use
# build-ffmpeg.yml for anything else (VideoConverter.ps1, actual encoding,
# etc) -- this build will refuse to do anything but decode audio, filter
# it through ebur128/pan/aformat, and discard the result.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            nasm
            yasm
            pkgconf
            mingw-w64-ucrt-x86_64-toolchain
          # That's the ENTIRE install list. Every third-party codec library
          # in build-ffmpeg.yml (x264, x265, dav1d, libvpx, opus, vorbis,
          # lame, fdk-aac, libass, libplacebo, vulkan, zimg, nvcodec, amf,
          # vpl...) existed to make ENCODING work, or to decode/render
          # VIDEO. Neither is needed here: audio decode uses ffmpeg's own
          # native LGPL decoders (aac/ac3/eac3/dca/truehd/flac/mp3/vorbis/
          # opus/wma/alac are all built into ffmpeg core, no external
          # library required), and there is no video path at all -- the
          # scan only ever maps an audio stream.

      - name: Fetch FFmpeg source
        shell: msys2 {0}
        run: git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-src

      - name: Configure FFmpeg (disable everything, re-enable only the scanner's needs)
        shell: msys2 {0}
        working-directory: ffmpeg-src
        run: |
          ./configure \
            --prefix=/ucrt64 \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-avdevice \
            --disable-swscale \
            --disable-network \
            --disable-ffplay \
            --enable-ffmpeg \
            --enable-ffprobe \
            --disable-everything \
            --enable-protocol=file \
            --enable-muxer=null \
            --enable-demuxer=matroska,mov,avi,asf,ogg,wav,flac,mp3,ac3,dts,aac \
            --enable-decoder=aac,aac_latm,ac3,eac3,dca,truehd,mlp,flac,mp3float,vorbis,opus,wmav1,wmav2,wmapro,wmalossless,alac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,pcm_u8 \
            --enable-parser=aac,ac3,dca,flac,mpegaudio,opus,vorbis,mlp \
            --enable-filter=ebur128,pan,aformat,aresample,anull,atrim,trim,asettb,asetnsamples
          # Threading deliberately left at its default (w32threads on
          # Windows) rather than disabled -- the size saved by stripping
          # threading support entirely is on the order of a few KB, not
          # worth the risk of an unverifiable build/runtime failure on a
          # component I can't actually test-compile myself before shipping
          # this workflow to you.

      - name: Compile
        shell: msys2 {0}
        working-directory: ffmpeg-src
        run: make -j$(nproc)

      - name: Show what got built
        shell: msys2 {0}
        working-directory: ffmpeg-src
        run: |
          ls -lh ffmpeg.exe ffprobe.exe
          ./ffmpeg.exe -version
          echo "--- Verifying what Auto-Audio.lua actually needs is present ---"
          MISSING=0
          for filt in ebur128 pan aformat; do
              if ! ./ffmpeg.exe -filters 2>&1 | grep -qE "\b${filt}\b"; then
                  echo "MISSING FILTER: $filt"
                  MISSING=1
              fi
          done
          for dec in aac ac3 eac3 dca truehd flac mp3float vorbis opus; do
              if ! ./ffmpeg.exe -decoders 2>&1 | grep -qE "\b${dec}\b"; then
                  echo "MISSING DECODER: $dec"
                  MISSING=1
              fi
          done
          if [ "$MISSING" -eq 1 ]; then
              echo "One or more filters/decoders the scanner depends on did not compile in - failing the build."
              exit 1
          fi
          echo "All required filters and decoders present."
          echo "--- Confirming this build has NO encoders (that's the point) ---"
          ENCODER_COUNT=$(./ffmpeg.exe -encoders 2>&1 | grep -cE '^ [VASDT]' || true)
          echo "Encoder count: $ENCODER_COUNT (should be 0)"

      - name: Bundle required DLLs
        shell: msys2 {0}
        working-directory: ffmpeg-src
        run: |
          # Should be close to none -- everything's built with
          # --enable-static and there are no third-party MSYS2 packages
          # linked in at all here, unlike the full build. ldd is still run
          # for real confirmation rather than assuming.
          mkdir -p dist
          cp ffmpeg.exe ffprobe.exe dist/
          for exe in ffmpeg.exe ffprobe.exe; do
              ldd "$exe" | grep -i '/ucrt64/bin/' | awk '{print $3}'
          done | sort -u | while read -r dll; do
              cp -n "$dll" dist/ 2>/dev/null || true
          done
          echo "Bundled files:"
          ls -lh dist/

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-scanner-build
          path: ffmpeg-src/dist/*
          retention-days: 7
